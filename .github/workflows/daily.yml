name: Daily Edition

on:
  schedule:
    - cron: "40 20 * * *"   # 매일 05:40 KST (UTC 20:40)
  workflow_dispatch:         # Actions 탭에서 수동 실행 버튼

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -r requirements.txt

      - name: Build today's edition
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          RESEARCH_FOCUS: ${{ secrets.RESEARCH_FOCUS }}
          GH_PRIVATE_REPO: ${{ secrets.GH_PRIVATE_REPO }}
          GH_TOKEN_PRIVATE: ${{ secrets.GH_TOKEN_PRIVATE }}
        run: python pipeline.py

      - name: Publish (공개 호만 커밋 — 아이디어는 이미 비공개 저장소에 저장됨)
        run: |
          git config user.name "morning-briefing-bot"
          git config user.email "morning-briefing-bot@users.noreply.github.com"
          git add editions/
          git diff --cached --quiet && exit 0
          git commit -m "Edition $(TZ=Asia/Seoul date +%F)"
          git pull --rebase
          git push
